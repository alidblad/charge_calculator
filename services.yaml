calculate_charge:
  name: Beräkna laddning
  description: >-
    Beräknar de billigaste laddfönstren för bil och husbatteri. Utan
    execute_actions returneras bara planen utan att något startas.
  fields:
    execute_actions:
      name: Utför laddåtgärder
      description: Starta och stoppa de konfigurerade tjänsterna när ett fönster är aktivt
      required: false
      default: false
      selector:
        boolean:
    car_charge_stop:
      name: Sluta ladda bil vid
      description: Sluta ladda när bilbatteriet når antal procent
      required: false
      example: 80
      selector:
        number:
          min: 50
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    car_charge_effect:
      name: Laddeffekt bil
      description: Laddeffekt i kW
      required: false
      example: 6.9
      selector:
        number:
          min: 1
          max: 22
          step: 0.1
          unit_of_measurement: kW
          mode: box
    car_max_sessions:
      name: Max antal laddpass bil
      description: >-
        Högsta antal laddpass, används bara om det faktiskt finns flera
        billiga perioder
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: slider
    house_charge_stop:
      name: Sluta ladda husbatteri vid
      description: Sluta ladda när husbatteriet når antal procent
      required: false
      example: 95
      selector:
        number:
          min: 50
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    house_charge_effect:
      name: Laddeffekt husbatteri
      description: Laddeffekt i kW
      required: false
      example: 4
      selector:
        number:
          min: 1
          max: 15
          step: 0.5
          unit_of_measurement: kW
          mode: box
    house_max_sessions:
      name: Max antal laddpass husbatteri
      description: >-
        Högsta antal laddpass, används bara om det faktiskt finns flera
        billiga perioder
      required: false
      example: 2
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: slider
