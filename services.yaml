calculate_charge:
  description: Calculate the cheapest charging windows for the car and house battery
  fields:
    execute_actions:
      name: Execute configured charge actions
      description: Start/stop the configured charger services when a calculated window is active
      required: false
      default: false
      selector:
        boolean:
    car_charge_stop:
      name: Sluta ladda bil vid
      description: Sluta ladda när batteriet når antal procent
      required: false
      default: 80
      selector:
        select:
          options:
            - 70
            - 80
            - 90
            - 100
    car_charge_effect:
      name: Laddeffekt bil
      description: Laddeffekt i kW
      required: false
      default: "6.9"
      selector:
        select:
          options:
            - 6.9
            - 8.2
            - 9.9
            - 11
    car_max_sessions:
      name: Max antal laddpass bil
      description: Högsta antal laddpass per dygn, används bara om det faktiskt finns flera billiga perioder
      required: false
      default: 1
      selector:
        select:
          options:
            - 1
            - 2
            - 3
    house_charge_stop:
      name: Sluta ladda husbatteri vid
      description: Sluta ladda när batteriet når antal procent
      required: false
      default: 95
      selector:
        select:
          options:
            - 70
            - 80
            - 90
            - 95
            - 100
    house_charge_effect:
      name: Laddeffekt husbatteri
      description: Laddeffekt i kW
      required: false
      default: 4
      selector:
        select:
          options:
            - 2
            - 3
            - 4
            - 5
            - 6
            - 7
            - 8
            - 9
            - 10
    house_max_sessions:
      name: Max antal laddpass husbatteri
      description: Högsta antal laddpass per dygn, används bara om det faktiskt finns flera billiga perioder
      required: false
      default: 1
      selector:
        select:
          options:
            - 1
            - 2
            - 3
